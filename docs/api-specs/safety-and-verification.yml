openapi: 3.1.0
info:
  title: Storks Safety and Verification Microservice
  version: "1.0"
  description: Handles OTP and QR code based verification for rides.

servers:
  - url: http://localhost:8089/api/v1
    description: Local Dev Server

paths:
  /health:
    get:
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string

  /test/mock-user:
    post:
      summary: Create a mock user for testing purposes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                role:
                  type: string
      responses:
        '200':
          description: Mock user created

  /otp/request:
    post:
      summary: Request a new OTP for a ride
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rideId:
                  type: string
                  format: uuid
                groupId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: OTP generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string

  /otp/verify:
    post:
      summary: Verify an OTP for a ride
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rideId:
                  type: string
                  format: uuid
                otp:
                  type: string
      responses:
        '200':
          description: OTP verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

  /qr/request:
    post:
      summary: Request a QR code for a ride
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rideId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: QR code data generated
          content:
            application/json:
              schema:
                type: object
                properties:
                  qrCode:
                    type: string

  /qr/verify:
    post:
      summary: Verify a QR code for a ride
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rideId:
                  type: string
                  format: uuid
                qrData:
                  type: string
      responses:
        '200':
          description: QR code verified successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
