openapi: 3.1.0
info:
  title: Storks Booking and Payment Service
  version: 1.0.0
  description: API for managing bookings, offers, and payments.

servers:
  - url: http://localhost:8081/api/v1
    description: Local Dev Server

paths:
  /bookings/my:
    get:
      summary: Get bookings for a specific parent
      parameters:
        - name: parentId
          in: query
          required: false
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of bookings
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BookingEventDTO'

  /bookings/check:
    get:
      summary: Check if a booking exists and is active
      parameters:
        - name: groupId
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: offerId
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Status of the booking
          content:
            application/json:
              schema:
                type: object
                properties:
                  exists:
                    type: boolean
                  isActive:
                    type: boolean

  /bookings/request:
    post:
      summary: Create a new booking request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                groupId:
                  type: string
                  format: uuid
                offerId:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Booking request created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BookingEventDTO'

  /bookings/{id}/cancel:
    put:
      summary: Cancel an existing booking
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Booking cancelled

  /bookings/stats:
    get:
      summary: Get aggregate booking stats
      responses:
        '200':
          description: Stats regarding total bookings and revenue
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalBookings:
                    type: integer
                  totalRevenue:
                    type: number

components:
  schemas:
    BookingEventDTO:
      type: object
      properties:
        id:
          type: string
          format: uuid
        groupId:
          type: string
          format: uuid
        offerId:
          type: string
          format: uuid
        status:
          $ref: './shared.yml#/components/schemas/RideStatus'
        startTime:
          type: string
          format: date-time
        endTime:
          type: string
          format: date-time
