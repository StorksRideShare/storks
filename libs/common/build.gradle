plugins {
    id 'java-library'
    id 'io.spring.dependency-management'
}


group = 'com.storks'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    api project(':libs:models')
    api project(':libs:events')
    api 'org.springframework.boot:spring-boot-starter-web:3.4.5'
    api 'org.springframework.boot:spring-boot-starter-security:3.4.5'
    api 'org.springframework.boot:spring-boot-starter-oauth2-resource-server:3.4.5'
    api 'org.springframework.kafka:spring-kafka'
    api 'org.springframework.boot:spring-boot-starter-data-redis:3.4.5'
    api 'com.fasterxml.jackson.core:jackson-databind'
    api 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'
    compileOnly 'org.projectlombok:lombok:1.18.30'
    annotationProcessor 'org.projectlombok:lombok:1.18.30'
    testImplementation 'org.springframework.boot:spring-boot-starter-test:3.4.5'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

dependencyManagement {
    imports {
        mavenBom 'org.springframework.boot:spring-boot-dependencies:3.4.5'
    }
}

tasks.named('test') {
    useJUnitPlatform()
}
