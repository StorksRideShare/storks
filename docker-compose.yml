version: "3.8"

services:
  # ==========================================
  # SHARED INFRASTRUCTURE
  # ==========================================
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: storks
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - microservices-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - microservices-network

  kafka:
    image: apache/kafka:latest
    ports:
      - "9092:9092"
    environment:
      - KAFKA_CFG_NODE_ID=0
      - KAFKA_CFG_PROCESS_ROLES=controller,broker
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=0@kafka:9093
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
    networks:
      - microservices-network

  # ==========================================
  # FRONTEND SERVICES
  # ==========================================
  website:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./apps/website:/app
    command: sh -c "npx pnpm install && npx pnpm dev --port 3000"
    ports:
      - "3000:3000"
    networks:
      - microservices-network

  parent-app:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./apps/parent-app:/app
    command: sh -c "npx pnpm install && npx pnpm expo start --port 3001"
    ports:
      - "3001:3001"
      - "8081:8081" # EXPO default
    networks:
      - microservices-network

  driver-app:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./apps/driver-app:/app
    command: sh -c "npx pnpm install && npx pnpm expo start --port 3002"
    ports:
      - "3002:3002"
    networks:
      - microservices-network

  admin-app:
    image: node:18-alpine
    working_dir: /app
    volumes:
      - ./apps/admin-web:/app
    command: sh -c "npx pnpm install && npx pnpm expo start --port 3003"
    ports:
      - "3003:3003"
    networks:
      - microservices-network

  # ==========================================
  # BACKEND SERVICES
  # ==========================================
  admin-service:
    build: ./services/admin-and-analytics
    ports:
      - "8085:8085"
    environment:
      - PORT=8085
    networks:
      - microservices-network
    depends_on:
      - postgres
      - redis
      - kafka

  booking-service:
    build: ./services/booking-and-payment
    ports:
      - "8081:8081"
    environment:
      - PORT=8081
    networks:
      - microservices-network
    depends_on:
      - postgres
      - redis
      - kafka

  location-service:
    build: ./services/location-and-navigation
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
    networks:
      - microservices-network
    depends_on:
      - postgres
      - redis
      - kafka

  user-service:
    build: ./services/user-service
    ports:
      - "8083:8083"
    environment:
      - PORT=8083
    networks:
      - microservices-network
    depends_on:
      - postgres
      - redis
      - kafka

  matching-intelligence:
    build: ./services/matching-intelligence
    ports:
      - "8084:8084"
    environment:
      - PORT=8084
    networks:
      - microservices-network
    depends_on:
      - postgres
      - redis
      - kafka

  live-messaging:
    build: ./services/live-messaging
    ports:
      - "8086:8086"
    environment:
      - PORT=8086
    networks:
      - microservices-network
    depends_on:
      - postgres
      - redis
      - kafka

  safety-service:
    build: ./services/safty-and-verification
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
    networks:
      - microservices-network
    depends_on:
      - postgres
      - redis
      - kafka

networks:
  microservices-network:
    driver: bridge

volumes:
  postgres_data:
