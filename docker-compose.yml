  # ==========================================
  # BACKEND SERVICES
  # ==========================================
  admin-service:
    container_name: storks-admin-service
    build:
      context: .
      dockerfile: Dockerfile
      target: admin-service
    ports:
      - "8085:8085"
    environment:
      - SPRING_PROFILES_ACTIVE=neon
      - SERVER_PORT=8085
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NEON_DB_URL=jdbc:postgresql://${NEON_HOST}/storks_admin?sslmode=require
      - NEON_DB_USERNAME=${ADMIN_SERVICE_DB_USERNAME}
      - NEON_DB_PASSWORD=${ADMIN_SERVICE_DB_PASSWORD}
    networks:
      - microservices-network
    depends_on:
      - kafka

  booking-service:
    container_name: storks-booking-service
    build:
      context: .
      dockerfile: Dockerfile
      target: booking-service
    ports:
      - "8088:8088"
    environment:
      - SPRING_PROFILES_ACTIVE=neon
      - SERVER_PORT=8088
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NEON_DB_URL=jdbc:postgresql://${NEON_HOST}/storks_booking?sslmode=require
      - NEON_DB_USERNAME=${BOOKING_SERVICE_DB_USERNAME}
      - NEON_DB_PASSWORD=${BOOKING_SERVICE_DB_PASSWORD}
    networks:
      - microservices-network
    depends_on:
      - kafka

  location-service:
    container_name: storks-location-service
    build:
      context: .
      dockerfile: services/location-and-navigation/Dockerfile
    ports:
      - "8082:8082"
    environment:
      - PORT=8082
      - DATABASE_URL=postgresql://${LOCATION_SERVICE_DB_USERNAME}:${LOCATION_SERVICE_DB_PASSWORD}@${NEON_HOST}/storks_location?sslmode=require&channel_binding=require
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=${REDIS_URL}
    networks:
      - microservices-network
    depends_on:
      - kafka

  user-service:
    container_name: storks-user-service
    build:
      context: .
      dockerfile: Dockerfile
      target: user-service
    ports:
      - "8083:8083"
    environment:
      - SPRING_PROFILES_ACTIVE=neon
      - SERVER_PORT=8083
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NEON_DB_URL=jdbc:postgresql://${NEON_HOST}/storks_users?sslmode=require
      - NEON_DB_USERNAME=${USER_SERVICE_DB_USERNAME}
      - NEON_DB_PASSWORD=${USER_SERVICE_DB_PASSWORD}
    networks:
      - microservices-network
    depends_on:
      - kafka

  matching-intelligence:
    container_name: storks-matching-intelligence
    build:
      context: .
      dockerfile: Dockerfile
      target: matching-intelligence
    ports:
      - "8084:8084"
    environment:
      - SPRING_PROFILES_ACTIVE=neon
      - SERVER_PORT=8084
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NEON_DB_URL=jdbc:postgresql://${NEON_HOST}/storks_matching?sslmode=require
      - NEON_DB_USERNAME=${MATCHING_SERVICE_DB_USERNAME}
      - NEON_DB_PASSWORD=${MATCHING_SERVICE_DB_PASSWORD}
    networks:
      - microservices-network
    depends_on:
      - kafka

  live-messaging:
    container_name: storks-live-messaging
    build:
      context: .
      dockerfile: Dockerfile
      target: live-messaging
    ports:
      - "8086:8086"
    environment:
      - SPRING_PROFILES_ACTIVE=neon
      - SERVER_PORT=8086
      - SPRING_KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - SPRING_DATA_REDIS_URL=${REDIS_URL}
      - INTERNAL_API_KEY=${INTERNAL_API_KEY}
      - NEON_DB_URL=jdbc:postgresql://${NEON_HOST}/storks_messaging?sslmode=require
      - NEON_DB_USERNAME=${MESSAGING_SERVICE_DB_USERNAME}
      - NEON_DB_PASSWORD=${MESSAGING_SERVICE_DB_PASSWORD}
    networks:
      - microservices-network
    depends_on:
      - kafka

  safety-service:
    container_name: storks-safety-service
    build:
      context: .
      dockerfile: services/safety-and-verification/Dockerfile
    ports:
      - "8089:8089"
    environment:
      - PORT=8089
      - DATABASE_URL=postgresql://${SAFETY_SERVICE_DB_USERNAME}:${SAFETY_SERVICE_DB_PASSWORD}@${NEON_HOST}/storks_verification?sslmode=require&channel_binding=require
      - KAFKA_BROKERS=kafka:9092
      - REDIS_URL=${REDIS_URL}
    networks:
      - microservices-network
    depends_on:
      - kafka

  storks-postgres:
    image: postgres:16-alpine
    container_name: storks-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_PASSWORD=storks
      - POSTGRES_USER=storks
    volumes:
      - ./infrastructure/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - microservices-network

networks:
  microservices-network:
    driver: bridge
