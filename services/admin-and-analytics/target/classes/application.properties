# ==================== DEVELOPMENT (ACTIVE) ====================
spring.datasource.url=jdbc:h2:mem:storks;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
# Safe for development (changed from create)
spring.jpa.show-sql=true

# HikariCP Tuning for Neon
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# Kafka Configuration (local for development)
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=admin-metrics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.storks.admin.dto
spring.kafka.listener.ack-mode=manual_immediate

# Logging
logging.level.root=INFO
logging.level.com.zaxxer.hikari=INFO
logging.level.org.hibernate=INFO
logging.level.org.springframework=INFO