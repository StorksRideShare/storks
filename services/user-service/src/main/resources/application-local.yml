spring:
  datasource:
    url: ${LOCAL_DB_URL:jdbc:postgresql://localhost:5432/storks_user_service}
    username: ${LOCAL_DB_USERNAME:storks}
    password: ${LOCAL_DB_PASSWORD:storks}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

storks:
  internal:
    user-service-url: http://localhost:8083
    api-key: ${INTERNAL_API_KEY:storks-internal-secret-2024-v1}

clerk:
  secret-key: ${CLERK_SECRET_KEY}
