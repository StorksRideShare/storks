spring.application.name=matching-intelligence

## SECURITY (JWT)
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://real-bird-20.clerk.accounts.dev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://real-bird-20.clerk.accounts.dev/.well-known/jwks.json

## KAFKA
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.client-id=storks.matching-intelligence
spring.kafka.producer.client-id=storks.matching-intelligence.producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.client-id=storks.matching-intelligence.consumer
spring.kafka.consumer.group-id=matching-intelligence-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
