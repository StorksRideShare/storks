spring.application.name=live-messaging

## DATABASE
spring.jpa.hibernate.ddl-auto=update

## REDIS
spring.data.redis.url=redis://default:tLqqIFHmEGaax3G7him6YkyqFkulPoWG@redis-13088.crce276.ap-south-1-3.ec2.cloud.redislabs.com:13088
spring.cache.type=redis
spring.cache.redis.time-to-live=600000

## KAFKA
spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.client-id=storks.live-messaging
spring.kafka.producer.client-id=storks.live-messaging.producer
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer

spring.kafka.consumer.client-id=storks.live-messaging.consumer
spring.kafka.consumer.group-id=live-messaging-group
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*

## DEVTOOLS
spring.devtools.restart.enabled=true
spring.devtools.livereload.enabled=true
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://real-bird-20.clerk.accounts.dev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://real-bird-20.clerk.accounts.dev/.well-known/jwks.json

## ACTUATOR
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
