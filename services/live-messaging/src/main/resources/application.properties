spring.application.name=live-messaging
storks.internal.user-service-url=http://localhost:8083
storks.internal.api-key=demo-key
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://real-bird-20.clerk.accounts.dev
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://real-bird-20.clerk.accounts.dev/.well-known/jwks.json

# Kafka Configuration
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.auto-offset-reset=earliest

# Confluent Cloud / SASL Configuration (Optional, activated by env vars)
spring.kafka.properties.security.protocol=${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
spring.kafka.properties.sasl.mechanism=${KAFKA_SASL_MECHANISM:PLAIN}
spring.kafka.properties.sasl.jaas.config=${KAFKA_SASL_JAAS_CONFIG:}