spring:
  application:
    name: live-messaging
  datasource:
    url: ${NEON_DB_URL}
    username: ${NEON_DB_USERNAME}
    password: ${NEON_DB_PASSWORD}
    hikari:
      max-lifetime: 240000 # 4 minutes
      keepalive-time: 60000 # 1 minute
      validation-timeout: 3000

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://real-bird-20.clerk.accounts.dev
          jwk-set-uri: https://real-bird-20.clerk.accounts.dev/.well-known/jwks.json

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    export:
      prometheus:
        enabled: true

storks:
  internal:
    user-service-url: ${USER_SERVICE_URL:http://user-service:8083}
    api-key: ${INTERNAL_API_KEY}