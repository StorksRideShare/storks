services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: live-messaging-app
    ports:
      - "8089:8089"
    volumes:
      - .:/home/gradle/app
      - gradle-cache:/home/gradle/.gradle
    working_dir: /home/gradle/app
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      GRADLE_OPTS: "-Dorg.gradle.native=false"
      SERVER_PORT: 8089
      SPRING_DATASOURCE_URL: jdbc:postgresql://ep-holy-credit-a118kh6w-pooler.ap-southeast-1.aws.neon.tech/storks?sslmode=require&channelBinding=require
      SPRING_DATASOURCE_USERNAME: neondb_owner
      SPRING_DATASOURCE_PASSWORD: npg_CPy4FrjaeO9l
    depends_on:
      - kafka

  kafka:
    image: apache/kafka:latest
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

volumes:
  gradle-cache: