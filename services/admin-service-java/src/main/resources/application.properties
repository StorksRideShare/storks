spring.application.name=admin-service-java
spring.docker.compose.enabled=false

# Database Configuration
spring.datasource.url=jdbc:postgresql://ep-damp-poetry-a17mj41n-pooler.ap-southeast-1.aws.neon.tech/neondb?user=neondb_owner&password=npg_CPy4FrjaeO9l&sslmode=require&channelBinding=require
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=true

# HikariCP Tuning for Neon
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=300000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.validation-timeout=5000
spring.datasource.hikari.leak-detection-threshold=60000
spring.datasource.hikari.connection-test-query=SELECT 1

# Kafka Configuration
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=admin-metrics-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.storks.admin.dto
spring.kafka.listener.ack-mode=manual_immediate

# Logging
logging:
  level:
    root: INFO
    com.zaxxer.hikari: INFO          # stops Hikari spam
    org.hibernate: INFO
    org.springframework: INFO

